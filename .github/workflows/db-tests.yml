name: Database tests

on:
  push:
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Run conflict tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/conflicts.sql